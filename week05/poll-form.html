<!DOCTYPE html>
<html lang="en">
    <head>

    <body>
        <header>

        </header>
        <main>
            <form>
                <fieldset>
                    <legend>Contact Information</legend>
                    <label for="fullname">Name:</label><br>
                    <input type="text" id="fullname" name="fullname"><br>
                    <labeñ for="useremail">Email:</labe><br>
                    <input type="email" id="useremail" name="useremail"></input><br>
                </fieldset>
                <fieldset>
                    <legend>Questions</legend>
                    <label for="browser">What is your favorite browser?</label>
                    <select id="browser" name="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="edge">Edge</option>
                    </select><br>
                    <label for="pet">Do yu have a household pet?</label>

                    <label for="feedback">List the places you have lived</label><br>
                    <textarea placeholder="Type your answer here" id="feedback" name="feedback"></textarea>
                </fieldset>
                <button type="submit">Submit Poll</button>
            </form>
        </main>
        <footer>
